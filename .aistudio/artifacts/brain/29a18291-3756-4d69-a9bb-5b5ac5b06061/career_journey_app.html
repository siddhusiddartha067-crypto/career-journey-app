              <nav className="hidden md:flex items-center gap-1">
                {navTabs.map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setCurrentTab(tab.id)}
                    className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-colors flex items-center gap-1.5 ${
                      currentTab === tab.id ? 'bg-indigo-50 text-indigo-700' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                    }`}
                  >
                    <span>{tab.icon}</span>
                    <span>{tab.label}</span>
                  </button>
                ))}
              </nav>

              <div className="flex items-center gap-2.5">
                <div className="flex items-center gap-1 px-2.5 py-1 rounded-full bg-amber-50 border border-amber-200 text-amber-700 text-xs font-semibold">
                  <span>🔥</span>
                  <span>{profile.streakDays}d Streak</span>
                </div>
                <button
                  onClick={() => setCurrentTab('profile')}
                  className="w-8 h-8 rounded-full bg-slate-900 text-white text-xs font-bold flex items-center justify-center hover:ring-2 hover:ring-indigo-500"
                >
                  {profile.name.charAt(0)}
                </button>
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 max-w-5xl w-full mx-auto px-4 py-6 pb-24 md:pb-12 animate-fadeIn">
            {/* 1. HOME */}
            {currentTab === 'home' && (
              <div className="space-y-6">
                <div className="relative overflow-hidden rounded-2xl bg-gradient-to-br from-indigo-900 via-indigo-800 to-slate-900 text-white p-6 sm:p-8 shadow-md">
                  <div className="max-w-2xl">
                    <span className="text-indigo-200 text-xs font-semibold uppercase tracking-wider block mb-2">
                      Engineering Student Career Companion
                    </span>
                    <h1 className="text-2xl sm:text-4xl font-extrabold mb-3">
                      Welcome back, {profile.name}! 👋
                    </h1>
                    <p className="text-indigo-100 text-sm sm:text-base leading-relaxed mb-6">
                      Every line of code you write and every problem you solve brings you closer to your dream software developer offer at Jain Institute of Technology Davangere. Small, consistent steps build unstoppable momentum.
                    </p>
                    <div className="flex flex-wrap gap-3">
                      <button
                        onClick={() => { triggerCelebration(); setCurrentTab('roadmap'); }}
                        className="px-5 py-3 rounded-xl bg-white text-indigo-900 font-bold text-sm shadow-md hover:bg-indigo-50 transition-all"
                      >
                        Start Your Career Journey 🚀
                      </button>
                      <button
                        onClick={() => setCurrentTab('daily')}
                        className="px-4 py-3 rounded-xl bg-indigo-700/60 hover:bg-indigo-700 text-white text-xs sm:text-sm font-semibold border border-indigo-400/30"
                      >
                        Today's Tasks ({completedTasks}/{tasks.length})
                      </button>
                    </div>
                  </div>
                </div>

                {/* Motivational Quote */}
                <div className="p-4 rounded-xl bg-amber-50 border border-amber-200 text-slate-800 text-xs sm:text-sm flex items-center gap-3">
                  <span className="text-xl">💡</span>
                  <div>
                    <span className="font-bold text-amber-900">Daily Engineering Wisdom: </span>
                    <span>"You don't have to be great to start, but you have to start to be great. Master one concept at a time."</span>
                  </div>
                </div>

                {/* Stats Grid */}
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                  <div onClick={() => setCurrentTab('roadmap')} className="p-4 rounded-xl bg-white border border-slate-200 cursor-pointer hover:border-indigo-300 transition-all">
                    <div className="text-xs font-semibold text-slate-500 uppercase">Roadmap</div>
                    <div className="text-2xl font-bold text-slate-900 mt-1">{roadmapPercent}%</div>
                    <p className="text-[11px] text-slate-500">{completedSteps} of 12 steps</p>
                  </div>
                  <div onClick={() => setCurrentTab('daily')} className="p-4 rounded-xl bg-white border border-slate-200 cursor-pointer hover:border-emerald-300 transition-all">
                    <div className="text-xs font-semibold text-slate-500 uppercase">Today's Tasks</div>
                    <div className="text-2xl font-bold text-slate-900 mt-1">{completedTasks}/{tasks.length}</div>
                    <p className="text-[11px] text-slate-500">{tasksPercent}% done</p>
                  </div>
                  <div onClick={() => setCurrentTab('coding')} className="p-4 rounded-xl bg-white border border-slate-200 cursor-pointer hover:border-blue-300 transition-all">
                    <div className="text-xs font-semibold text-slate-500 uppercase">DSA Solved</div>
                    <div className="text-2xl font-bold text-slate-900 mt-1">{solvedDSA}/{dsa.length}</div>
                    <p className="text-[11px] text-slate-500">Practice questions</p>
                  </div>
                  <div onClick={() => setCurrentTab('projects')} className="p-4 rounded-xl bg-white border border-slate-200 cursor-pointer hover:border-purple-300 transition-all">
                    <div className="text-xs font-semibold text-slate-500 uppercase">Projects</div>
                    <div className="text-2xl font-bold text-slate-900 mt-1">{completedProjects}/{projects.length}</div>
                    <p className="text-[11px] text-slate-500">Completed portfolio</p>
                  </div>
                </div>
              </div>
            )}

            {/* 2. ROADMAP */}
            {currentTab === 'roadmap' && (
              <div className="space-y-6">
                <div className="p-5 sm:p-6 rounded-2xl bg-white border border-slate-200">
                  <h1 className="text-xl sm:text-2xl font-extrabold text-slate-900">Software Developer Roadmap (12 Steps)</h1>
                  <p className="text-xs sm:text-sm text-slate-600 mt-1">
                    Structured 12-milestone engineering curriculum from HTML & CSS to Placement & Interview Preparation.
                  </p>
                  <div className="mt-4 w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                    <div className="bg-indigo-600 h-2 transition-all duration-500" style={{ width: `${roadmapPercent}%` }}></div>
                  </div>
                  <div className="flex justify-between text-xs text-slate-500 mt-1.5 font-medium">
                    <span>{completedSteps} of 12 steps completed</span>
                    <span className="font-bold text-indigo-600">{roadmapPercent}%</span>
                  </div>
                </div>

                <div className="space-y-3">
                  {roadmap.map(step => (
                    <div key={step.id} className="p-5 rounded-2xl bg-white border border-slate-200 shadow-xs space-y-3">
                      <div className="flex items-start justify-between gap-3">
                        <div className="flex items-center gap-3">
                          <span className={`w-8 h-8 rounded-xl flex items-center justify-center text-xs font-bold shrink-0 ${
                            step.status === 'completed' ? 'bg-emerald-500 text-white' : step.status === 'in_progress' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'
                          }`}>
                            {step.status === 'completed' ? '✓' : step.id}
                          </span>
                          <div>
                            <div className="text-[11px] text-slate-400 font-medium">Step {step.id} · {step.category} · {step.estimatedWeeks}</div>
                            <h2 className="text-base font-bold text-slate-900">{step.title}</h2>
                          </div>
                        </div>

                        <select
                          value={step.status}
                          onChange={(e) => {
                            const newStatus = e.target.value;
                            setRoadmap(prev => prev.map(s => {
                              if (s.id !== step.id) return s;
                              return {
                                ...s,
                                status: newStatus,
                                subSkills: s.subSkills.map(sub => ({
                                  ...sub,
                                  completed: newStatus === 'completed' ? true : newStatus === 'not_started' ? false : sub.completed
                                }))
                              };
                            }));
                            if (newStatus === 'completed') triggerCelebration();
                          }}
                          className="text-xs font-semibold px-2.5 py-1 rounded-lg border border-slate-200 bg-white shrink-0"
                        >
                          <option value="not_started">⚪ Not Started</option>
                          <option value="in_progress">🔵 In Progress</option>
                          <option value="completed">🟢 Completed</option>
                        </select>
                      </div>

                      <p className="text-xs text-slate-600">{step.description}</p>

                      <div className="pt-2 border-t border-slate-100 space-y-1.5">
                        <span className="text-[11px] font-bold text-slate-500 uppercase tracking-wider block">Competencies</span>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                          {step.subSkills.map(sub => (
                            <div
                              key={sub.id}
                              onClick={() => {
                                setRoadmap(prev => prev.map(s => {
                                  if (s.id !== step.id) return s;
                                  const updatedSubs = s.subSkills.map(sb => sb.id === sub.id ? { ...sb, completed: !sb.completed } : sb);
                                  const allDone = updatedSubs.every(sb => sb.completed);
                                  const someDone = updatedSubs.some(sb => sb.completed);
                                  const nextStatus = allDone ? 'completed' : someDone ? 'in_progress' : 'not_started';
                                  if (allDone && s.status !== 'completed') triggerCelebration();
                                  return { ...s, subSkills: updatedSubs, status: nextStatus };
                                }));
                              }}
                              className={`flex items-center gap-2 p-2 rounded-lg border text-xs cursor-pointer transition-colors ${
                                sub.completed ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-white text-slate-700 border-slate-200'
                              }`}
                            >
                              <input type="checkbox" checked={sub.completed} readOnly className="rounded text-emerald-600" />
                              <span className={sub.completed ? 'line-through text-slate-400' : ''}>{sub.name}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 3. DAILY LEARNING */}
            {currentTab === 'daily' && (
              <div className="space-y-6">
                <div className="p-5 sm:p-6 rounded-2xl bg-white border border-slate-200">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                      <h1 className="text-xl sm:text-2xl font-extrabold text-slate-900">Daily Learning Tracker</h1>
                      <p className="text-xs sm:text-sm text-slate-600 mt-1">Set daily targets, check them off, and maintain your streak.</p>
                    </div>
                    <div className="text-right">
                      <div className="text-2xl font-extrabold text-emerald-600">{tasksPercent}%</div>
                      <span className="text-xs text-slate-500">{completedTasks} of {tasks.length} Completed</span>
                    </div>
                  </div>
                </div>

                <div className="space-y-2.5">
                  {tasks.map(task => (
                    <div
                      key={task.id}
                      className={`p-4 rounded-xl border flex items-center justify-between gap-3 ${
                        task.completed ? 'bg-slate-50 text-slate-400 border-slate-200' : 'bg-white text-slate-800 border-slate-200 shadow-xs'
                      }`}
                    >
                      <div
                        onClick={() => {
                          setTasks(prev => prev.map(t => t.id === task.id ? { ...t, completed: !t.completed } : t));
                          if (!task.completed) triggerCelebration();
                        }}
                        className="flex items-center gap-3 cursor-pointer flex-1"
                      >
                        <input type="checkbox" checked={task.completed} readOnly className="w-4 h-4 text-emerald-600 rounded" />
                        <div>
                          <p className={`text-xs sm:text-sm font-semibold ${task.completed ? 'line-through text-slate-400' : 'text-slate-900'}`}>{task.title}</p>
                          <span className="text-[11px] text-slate-400">{task.category} · {task.estimatedMinutes} min · {task.priority} priority</span>
                        </div>
                      </div>
                      <button
                        onClick={() => setTasks(prev => prev.filter(t => t.id !== task.id))}
                        className="text-slate-300 hover:text-rose-500 p-1 text-xs"
                      >
                        ✕
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 4. PROJECTS */}
            {currentTab === 'projects' && (
              <div className="space-y-6">
                <div className="p-5 sm:p-6 rounded-2xl bg-white border border-slate-200">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                      <h1 className="text-xl sm:text-2xl font-extrabold text-slate-900">Projects Showcase & Planner</h1>
                      <p className="text-xs sm:text-sm text-slate-600 mt-1">Project name, description, technologies, status, GitHub source, and live demo link.</p>
                    </div>
                    <button
                      onClick={() => {
                        setEditingProject({
                          id: 'proj-' + Date.now(),
                          title: '',
                          description: '',
                          technologies: [],
                          status: 'In Progress',
                          githubUrl: '',
                          liveUrl: ''
                        });
                        setIsProjectModalOpen(true);
                      }}
                      className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl self-start sm:self-auto"
                    >
                      + Add Project
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {projects.map(proj => (
                    <div key={proj.id} className="p-5 rounded-2xl bg-white border border-slate-200 shadow-xs flex flex-col justify-between">
                      <div>
                        <div className="flex items-start justify-between gap-2 mb-2">
                          <div>
                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Project Name</span>
                            <h2 className="text-sm sm:text-base font-bold text-slate-900">{proj.title}</h2>
                          </div>
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded shrink-0 ${
                            proj.status === 'Completed' ? 'bg-emerald-100 text-emerald-700' : proj.status === 'In Progress' ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-100 text-slate-700'
                          }`}>
                            {proj.status}
                          </span>
                        </div>
                        <div className="mb-3">
                          <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Description</span>
                          <p className="text-xs text-slate-600">{proj.description}</p>
                        </div>
                        <div className="mb-3">
                          <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Technologies</span>
                          <div className="flex flex-wrap gap-1">
                            {proj.technologies.map((t, idx) => (
                              <span key={idx} className="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-medium">{t}</span>
                            ))}
                          </div>
                        </div>
                      </div>
                      <div className="flex items-center gap-3 pt-3 border-t border-slate-100 text-xs">
                        {proj.githubUrl && <a href={proj.githubUrl} target="_blank" className="font-semibold text-slate-700 hover:text-indigo-600">GitHub Code ↗</a>}
                        {proj.liveUrl && <a href={proj.liveUrl} target="_blank" className="font-semibold text-indigo-600 hover:text-indigo-800">Live Demo ↗</a>}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 5. CODING PRACTICE (DSA) */}
            {currentTab === 'coding' && (
              <div className="space-y-6">
                <div className="p-5 sm:p-6 rounded-2xl bg-white border border-slate-200">
                  <h1 className="text-xl sm:text-2xl font-extrabold text-slate-900">Data Structures & Algorithms</h1>
                  <p className="text-xs sm:text-sm text-slate-600 mt-1">
                    Master essential problem patterns across Arrays, Strings, Linked Lists, Stack, Queue, Hash Map, Trees, Graphs, Sorting, and Searching.
                  </p>
                  
                  {/* Category Filter Chips */}
                  <div className="mt-4 flex items-center gap-1.5 overflow-x-auto pb-1 scrollbar-none">
                    {dsaCategories.map(cat => (
                      <button
                        key={cat}
                        onClick={() => setSelectedDsaTopic(cat)}
                        className={`px-3 py-1.5 rounded-xl text-xs whitespace-nowrap transition-colors ${
                          selectedDsaTopic === cat ? 'bg-slate-900 text-white font-bold' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                        }`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="space-y-2.5">
                  {dsa
                    .filter(prob => selectedDsaTopic === 'All' || prob.topic === selectedDsaTopic)
                    .map(prob => (
                    <div key={prob.id} className="p-4 rounded-xl bg-white border border-slate-200 shadow-xs space-y-2">
                      <div className="flex items-start justify-between gap-3">
                        <div
                          onClick={() => {
                            setDsa(prev => prev.map(p => p.id === prob.id ? { ...p, completed: !p.completed } : p));
                            if (!prob.completed) triggerCelebration();
                          }}
                          className="flex items-center gap-3 cursor-pointer"
                        >
                          <input type="checkbox" checked={prob.completed} readOnly className="w-4 h-4 text-emerald-600 rounded" />
                          <div>
                            <div className="flex items-center gap-2">
                              <h2 className={`text-xs sm:text-sm font-bold ${prob.completed ? 'line-through text-slate-400' : 'text-slate-900'}`}>{prob.title}</h2>
                              <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${
                                prob.difficulty === 'Easy' ? 'bg-emerald-100 text-emerald-700' : prob.difficulty === 'Medium' ? 'bg-amber-100 text-amber-700' : 'bg-rose-100 text-rose-700'
                              }`}>
                                {prob.difficulty}
                              </span>
                            </div>
                            <span className="text-[11px] text-slate-500">{prob.topic} · Time: {prob.timeComplexity} · Space: {prob.spaceComplexity}</span>
                          </div>
                        </div>

                        <a href={prob.practiceUrl} target="_blank" className="text-xs font-semibold text-indigo-600 hover:text-indigo-800 shrink-0">Solve ↗</a>
                      </div>

                      <div className="p-2.5 rounded-lg bg-slate-50 text-[11px] text-slate-600 border border-slate-100">
                        <span className="font-bold text-slate-800">Intuition: </span>{prob.hint}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 6. CAREER & INTERVIEW */}
            {currentTab === 'career' && (
              <div className="space-y-6">
                <div className="p-5 sm:p-6 rounded-2xl bg-white border border-slate-200">
                  <h1 className="text-xl sm:text-2xl font-extrabold text-slate-900">Career & Placement Accelerator</h1>
                  <p className="text-xs sm:text-sm text-slate-600 mt-1">ATS resume rules, cold outreach templates, and core technical interview questions.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="p-5 rounded-2xl bg-white border border-slate-200 shadow-xs space-y-3">
                    <h2 className="text-sm font-bold text-slate-900">ATS Resume Essentials for Students</h2>
                    <ul className="text-xs text-slate-600 space-y-1.5 list-disc pl-4">
                      <li>Single-column layout with clean margins and no multi-column tables.</li>
                      <li>Use standard section headers: Education, Technical Skills, Featured Projects, Experience.</li>
                      <li>Write bullets with Google XYZ formula: "Accomplished [X] as measured by [Y] by doing [Z]".</li>
                      <li>Group technical skills into Languages, Frameworks, Developer Tools, and Core CS.</li>
                    </ul>
                  </div>

                  <div className="p-5 rounded-2xl bg-white border border-slate-200 shadow-xs space-y-3">
                    <h2 className="text-sm font-bold text-slate-900">Core CS Interview Topics</h2>
                    <ul className="text-xs text-slate-600 space-y-1.5 list-disc pl-4">
                      <li><strong className="text-slate-800">OOP:</strong> Encapsulation, Abstraction, Inheritance, Polymorphism.</li>
                      <li><strong className="text-slate-800">DBMS:</strong> ACID properties, indexing, normalization (1NF to 3NF).</li>
                      <li><strong className="text-slate-800">OS:</strong> Process vs Thread, Deadlock 4 conditions, Virtual memory.</li>
                      <li><strong className="text-slate-800">CN:</strong> TCP 3-way handshake, DNS lookup, HTTP vs HTTPS.</li>
                    </ul>
                  </div>
                </div>
              </div>
            )}

            {/* 7. PROFILE */}
            {currentTab === 'profile' && (
              <div className="space-y-6">
                <div className="p-5 sm:p-6 rounded-2xl bg-white border border-slate-200 shadow-xs">
                  <div className="flex items-center gap-4 mb-4">
                    <div className="w-16 h-16 rounded-2xl bg-slate-900 text-white font-extrabold text-2xl flex items-center justify-center">
                      {profile.name.charAt(0)}
                    </div>
                    <div>
                      <h1 className="text-xl font-bold text-slate-900">{profile.name}</h1>
                      <p className="text-xs text-slate-600">{profile.branch} · {profile.yearOfStudy}</p>
                      <p className="text-xs text-indigo-600 font-semibold">{profile.college}</p>
                    </div>
                  </div>

                  <p className="text-xs sm:text-sm text-slate-700 border-t border-slate-100 pt-3">{profile.bio}</p>

                  <div className="mt-4 pt-3 border-t border-slate-100">
                    <span className="text-xs font-bold text-slate-700 block mb-2">Technical Skills</span>
                    <div className="flex flex-wrap gap-1.5">
                      {profile.skills.map((s, idx) => (
                        <span key={idx} className="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 text-xs font-medium">
                          {s.name} <span className="text-[10px] text-slate-400">({s.level})</span>
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Mobile Bottom Navigation Bar */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 md:hidden">
            <div className="grid grid-cols-7 h-16 max-w-lg mx-auto">
              {navTabs.map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setCurrentTab(tab.id)}
                  className={`flex flex-col items-center justify-center py-1 transition-colors ${
                    currentTab === tab.id ? 'text-indigo-600 font-bold' : 'text-slate-500'
                  }`}
                >
                  <span className="text-lg">{tab.icon}</span>
                  <span className="text-[10px] tracking-tight">{tab.label}</span>
                </button>
              ))}
            </div>
          </nav>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
